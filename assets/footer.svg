<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="90" viewBox="0 0 1280 90">
<defs><style>@font-face{font-family:Mono;src:url(data:font/woff;base64,) format('woff')}</style>
<pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse"><rect width="3" height="1" fill="#fff" opacity="0.018"/></pattern>

<style>
@keyframes blink{50%{opacity:0}} @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.blink{animation:blink 1.1s infinite steps(1)} .pulse{animation:pulse 2s infinite ease-in-out}

</style>
</defs>
<rect width="1280" height="90" fill="#06080C"/><line x1="0" y1="24" x2="1280" y2="24" stroke="#2A323E"/><rect x="0" y="22" width="120" height="4" fill="#FF3C4E"/><text x="640.0" y="64.0" font-family="Mono,'JetBrains Mono',Consolas,monospace" font-size="15" fill="#AEB7C4" letter-spacing="4" text-anchor="middle">END OF FILE  //  NEXT STOP: THE TOP FLOOR</text><rect class="blink" x="914" y="51" width="9" height="16" fill="#FF3C4E"/>
<rect width="1280" height="90" fill="url(#scan)"/>
</svg>